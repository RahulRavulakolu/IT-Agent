apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-gateway
  namespace: monitoring
  labels:
    app: event-gateway
    release: kps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-gateway
  template:
    metadata:
      labels:
        app: event-gateway
        release: kps
    spec:
      containers:
        - name: event-gateway
          image: event-gateway:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: event-gateway-config
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
