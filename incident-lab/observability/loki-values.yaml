# Loki Helm values – chart version 6.6.2
# Single-binary mode (simplest, fits in ~256Mi)

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  auth_enabled: false
  limits_config:
    reject_old_samples: false
    reject_old_samples_max_age: 168h
    allow_structured_metadata: false

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Disable components not needed in single-binary mode
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Bundled Grafana Agent not needed (using Promtail separately)
chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi
