kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: incident-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.30.0@sha256:047357ac0cfea04663786a612ba1eaba9702bef25227a794b52890dd8bcd692e
    extraPortMappings:
      # Grafana
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
      # Prometheus
      - containerPort: 30909
        hostPort: 9090
        protocol: TCP
  - role: worker
    image: kindest/node:v1.30.0@sha256:047357ac0cfea04663786a612ba1eaba9702bef25227a794b52890dd8bcd692e
networking:
  # Use a non-default pod subnet to avoid conflicts with common home routers
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
