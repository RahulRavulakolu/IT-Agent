apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: staging
  labels:
    app: loadgen
    component: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
        component: loadgen
    spec:
      containers:
        - name: locust
          image: loadgen:v1
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          env:
            - name: LOCUST_HOST
              value: "http://web-service"
